name: Tests

on: [push, pull_request]

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rev: [nightly] 
        include:
          - os: ubuntu-latest
            install-rg: sudo apt-get update && sudo apt-get install -y ripgrep

    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.2
      - name: Prepare
        run: |
          ${{ matrix.install-rg }}
          rg --version
          git clone --depth 1 https://github.com/neovim-lua/plenary.nvim ../plenary.nvim
      - name: Run tests
        run: |
          nvim --version
          make test
